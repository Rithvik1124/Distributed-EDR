title: Suspicious Process Names
id: Trial-Rule-Not-Important
status: test
description: Detects suspicious process names based on their comm value
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-05

tags:
  - attack.stealth
  - attack.t1014

logsource:
  category: process_creation
  product: linux

detection:
  selection:
    - comm: 'noctalia'
    - comm|contains:
        - 'server'
        - '/usr'

  condition: selection

falsepositives:
  - Legitimate processes with matching names

level: high